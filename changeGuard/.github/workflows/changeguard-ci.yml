name: ChangeGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install target-app dependencies
        run: |
          cd target-app
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd target-app
          pytest

      - name: Start ChangeGuard
        run: |
          docker compose up -d --build

      - name: Wait for ChangeGuard API
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/docs > /dev/null; then
              echo "ChangeGuard API is ready"
              exit 0
            fi
            echo "Waiting for ChangeGuard..."
            sleep 5
          done

          echo "ChangeGuard API did not start"
          docker compose logs
          exit 1

      - name: Run ChangeGuard risk analysis
        run: |
          git diff HEAD^ HEAD > change.diff

          DIFF_TEXT=$(jq -Rs . < change.diff)

          curl -s -X POST http://localhost:8000/analyze-change \
            -H "Content-Type: application/json" \
            -d "{
              \"repository\": \"${GITHUB_REPOSITORY}\",
              \"commit_sha\": \"${GITHUB_SHA}\",
              \"branch\": \"${GITHUB_REF_NAME}\",
              \"service_name\": \"target-app\",
              \"tests_passed\": true,
              \"diff_text\": ${DIFF_TEXT}
            }" | tee changeguard-result.json

      - name: Enforce ChangeGuard decision
        run: |
          RISK=$(jq -r '.risk_score' changeguard-result.json)
          LEVEL=$(jq -r '.risk_level' changeguard-result.json)
          DECISION=$(jq -r '.decision' changeguard-result.json)

          echo "Risk Score: $RISK"
          echo "Risk Level: $LEVEL"
          echo "Decision: $DECISION"

          if [ "$RISK" -ge 70 ]; then
            echo "HIGH RISK CHANGE - DEPLOYMENT BLOCKED"
            exit 1
          fi

          echo "ChangeGuard gate passed"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build target-app Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/changeguard-target-app:${GITHUB_SHA} \
            ./target-app

      - name: Push Docker image to GHCR
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/changeguard-target-app:${GITHUB_SHA}

      - name: Stop services
        if: always()
        run: |
          docker compose down
